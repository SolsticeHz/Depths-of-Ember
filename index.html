<script>
"use strict";
const R=Math.random,rr=(a,b)=>a+R()*(b-a),ri=(a,b)=>Math.floor(rr(a,b+1)),TAU=Math.PI*2;
const T=40,WH=40,MW=56,MH=44,CA=Math.cos(.88),SA=Math.sin(.88),CD=520,CF=650;
const WC=['#cfd6dd','#6fe38a','#5cb8ff','#c77dff','#ffb347','#ff5a5a','#ff5ad0','#40f0e0','#fff2a0'];
const AC=['#7a5b3a','#8a8f98','#4f8fd0','#8a4fd0','#d0a030','#d04a4a','#d05aa8','#3ab8b0','#f0e0a0'];
const ED={skel:{hp:22,sp:110,r:11,xp:6,g:3},cult:{hp:16,sp:70,r:11,xp:9,g:5},golem:{hp:95,sp:48,r:17,xp:25,g:14},
  bat:{hp:9,sp:175,r:8,xp:4,g:2},bomber:{hp:14,sp:125,r:10,xp:7,g:4},wraith:{hp:26,sp:60,r:11,xp:12,g:7},boss:{hp:230,sp:62,r:24,xp:150,g:90}};
const RL=[
 {id:'coin',n:'Lucky Coin',r:0,d:'+50% gold from drops.'},
 {id:'tome',n:'Scholars Tome',r:0,d:'+30% XP gained.'},
 {id:'magnet',n:'Magnet Ring',r:0,d:'Gold and XP orbs are pulled from twice as far.'},
 {id:'boots',n:'Swift Boots',r:1,d:'+15% move speed and a faster dash cooldown.',f:p=>p.sp*=1.15},
 {id:'crit',n:'Eagle Eye',r:1,d:'Critical hit chance rises from 15% to 30%.'},
 {id:'vamp',n:'Vampiric Fang',r:2,d:'Heal for 10% of the damage you deal.'},
 {id:'heart',n:'Iron Heart',r:2,d:'+40 Max HP, healed on purchase.',f:p=>{p.mhp+=40;p.hp+=40}},
 {id:'phoenix',n:'Phoenix Feather',r:3,d:'Once per run: when you would die, revive with half HP.'}];
const RN=['Common','Rare','Epic','Legendary'],RC=['#b9b2a2','#5cb8ff','#c77dff','#ffb347'],PB=[70,150,280,460];
const WN=['Worn Sword','Iron Blade','Steel Saber','Mythril Edge','Gilded Claymore','Emberbrand','Voidreaver','Stormbringer','Dawnbreaker'],AN=['Tattered Garb','Iron Mail','Steel Plate','Mythril Mail','Gilded Plate','Ember Aegis','Void Carapace','Storm Plate','Dawn Aegis'],TN=['white','green','blue','purple','amber','red','magenta','cyan','radiant'],MT=8;

class SoundEngine{
  constructor(){this.c=null}
  init(){
    if(!this.c){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;this.c=new C();
      const n=this.c.sampleRate*.5,b=this.c.createBuffer(1,n,this.c.sampleRate),d=b.getChannelData(0);
      for(let i=0;i<n;i++)d[i]=R()*2-1;this.nb=b}
    if(this.c.state==='suspended')this.c.resume()}
  tone(f,t,d,v=.12,s=0,dl=0){if(!this.c)return;const c=this.c,o=c.createOscillator(),g=c.createGain(),n=c.currentTime+dl;
    o.type=t;o.frequency.setValueAtTime(f,n);if(s)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+s),n+d);
    g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(c.destination);o.start(n);o.stop(n+d+.02)}
  noise(d,v,f){if(!this.c)return;const c=this.c,s=c.createBufferSource(),fl=c.createBiquadFilter(),g=c.createGain(),n=c.currentTime;
    s.buffer=this.nb;fl.type='bandpass';fl.frequency.value=f;g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);
    s.connect(fl);fl.connect(g);g.connect(c.destination);s.start(n);s.stop(n+d)}
  swing(){this.noise(.15,.25,1800)} dash(){this.noise(.25,.25,800)} step(){this.noise(.05,.06,220)}
  hit(){this.noise(.12,.35,500);this.tone(140,'square',.12,.12,-80)} hurt(){this.tone(220,'sawtooth',.25,.18,-160)}
  pick(){this.tone(880,'sine',.1);this.tone(1320,'sine',.18,.1,0,.08)} shoot(){this.tone(640,'sine',.2,.08,-340)}
  boom(){this.noise(.4,.45,150);this.tone(90,'sine',.3,.3,-50)}
  lvl(){[523,659,784,1047].forEach((f,i)=>this.tone(f,'square',.25,.1,0,i*.1))}
}

class Particle{
  constructor(x,y,a,s,c,l,g=0,z=3){this.x=x;this.y=y;this.vx=Math.cos(a)*s;this.vy=Math.sin(a)*s;this.c=c;this.l=this.m=l;this.g=g;this.z=z}
  update(dt){this.l-=dt;this.x+=this.vx*dt;this.y+=this.vy*dt;this.vy+=this.g*dt;this.vx*=.985}
  draw(c,o){const a=Math.max(0,this.l/this.m);c.globalAlpha=a;c.fillStyle=this.c;const s=this.z*(.4+a)*o.s;c.fillRect(o.x-s/2,o.y-s/2,s,s)}
}

class Dungeon{
  constructor(mk,boss){
    this.g=Array.from({length:MH},()=>Array(MW).fill(1));
    this.ex=Array.from({length:MH},()=>Array(MW).fill(0));
    this.pg=Array.from({length:MH},()=>new Uint8Array(MW));
    this.vis=Array.from({length:MH},()=>new Uint8Array(MW));
    this.lt=Array.from({length:MH},()=>new Float32Array(MW));
    this.gt=Array.from({length:MH},()=>new Float32Array(MW));
    this.rooms=[];
    if(mk){
      const r={x:10,y:15,w:24,h:13,cx:22,cy:21,type:'market'};this.rooms.push(r);
      for(let j=r.y;j<r.y+r.h;j++)for(let k=r.x;k<r.x+r.w;k++)this.g[j][k]=0;return}
    const carve=r=>{for(let j=r.y;j<r.y+r.h;j++)for(let k=r.x;k<r.x+r.w;k++)this.g[j][k]=0};
    const link=(a,b)=>{
      for(let x=Math.min(a.cx,b.cx);x<=Math.max(a.cx,b.cx)+1;x++){this.g[a.cy][x]=0;this.g[a.cy+1][x]=0}
      for(let y=Math.min(a.cy,b.cy);y<=Math.max(a.cy,b.cy)+1;y++){this.g[y][b.cx]=0;this.g[y][b.cx+1]=0}};
    const split=(n,dp)=>{
      const cw=n.w>=26,ch=n.h>=22;
      if(dp>=3||(!cw&&!ch)){
        const w=ri(6,Math.min(11,n.w-3)),h=ri(5,Math.min(8,n.h-3)),x=n.x+ri(1,n.w-w-2),y=n.y+ri(1,n.h-h-2);
        const r={x,y,w,h,cx:x+(w>>1),cy:y+(h>>1),type:'combat'};this.rooms.push(r);carve(r);return r}
      const v=cw&&(!ch||n.w/n.h>1.2||(n.w/n.h>.8&&R()<.5));let a,b;
      if(v){const s=ri(13,n.w-13);a=split({x:n.x,y:n.y,w:s,h:n.h},dp+1);b=split({x:n.x+s,y:n.y,w:n.w-s,h:n.h},dp+1)}
      else{const s=ri(11,n.h-11);a=split({x:n.x,y:n.y,w:n.w,h:s},dp+1);b=split({x:n.x,y:n.y+s,w:n.w,h:n.h-s},dp+1)}
      link(a,b);return R()<.5?a:b};
    split({x:1,y:1,w:MW-2,h:MH-2},0);
    const rs=this.rooms;rs[0].type='start';
    let far=rs[1],fd=0;rs.forEach(r=>{const q=Math.hypot(r.cx-rs[0].cx,r.cy-rs[0].cy);if(q>fd){fd=q;far=r}});far.type=boss?'boss':'exit';
    const mid=rs.filter(r=>r.type==='combat');if(R()<.3)mid[ri(0,mid.length-1)].type='treasure';
    if(boss){const b=far,all=(x0,y0,x1,y1)=>{for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)if(x<1||y<1||x>=MW-1||y>=MH-1||this.g[y][x]===0)return false;return true};
      for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]].sort(()=>R()-.5)){
        const fx=dx>0?b.x+b.w+4:dx<0?b.x-12:b.cx-3,fy=dy>0?b.y+b.h+4:dy<0?b.y-12:b.cy-3,
          cr=dx?[dx>0?b.x+b.w:fx+8,b.cy,dx>0?fx-1:b.x-1,b.cy+1]:[b.cx,dy>0?b.y+b.h:fy+8,b.cx+1,dy>0?fy-1:b.y-1];
        if(!all(fx-1,fy-1,fx+8,fy+8)||!all(...cr))continue;
        carve({x:fx,y:fy,w:8,h:8});carve({x:cr[0],y:cr[1],w:cr[2]-cr[0]+1,h:cr[3]-cr[1]+1});
        this.rooms.push({x:fx,y:fy,w:8,h:8,cx:fx+4,cy:fy+4,type:'final'});break}}
  }
  wall(tx,ty){return tx<0||ty<0||tx>=MW||ty>=MH||this.g[ty][tx]===1||this.gt[ty][tx]>.4}
  look(px,py){const tx=px/T|0,ty=py/T|0,rad=7;
    for(const r of this.vis)r.fill(0);
    for(let j=-rad;j<=rad;j++)for(let i=-rad;i<=rad;i++){const x=tx+i,y=ty+j;
      if(i*i+j*j>rad*rad||x<0||y<0||x>=MW||y>=MH)continue;
      if(this.los(tx,ty,x,y)){this.vis[y][x]=1;this.ex[y][x]=1}}
    for(let j=-rad;j<=rad;j++)for(let i=-rad;i<=rad;i++){const x=tx+i,y=ty+j;
      if(x<1||y<1||x>=MW-1||y>=MH-1||this.vis[y][x]||!this.wall(x,y))continue;
      for(let b=-1;b<=1;b++)for(let a=-1;a<=1;a++)if(this.vis[y+b][x+a]&&!this.wall(x+a,y+b)){this.vis[y][x]=1;this.ex[y][x]=1}}}
  ahead(px,py){const tx=px/T|0,ty=py/T|0,rad=12;
    for(let j=-rad;j<=rad;j++)for(let i=-rad;i<=rad;i++){const x=tx+i,y=ty+j;
      if(i*i+j*j<=rad*rad&&x>=0&&y>=0&&x<MW&&y<MH)this.pg[y][x]=1}}
  los(x0,y0,x1,y1){const dx=Math.abs(x1-x0),dy=Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1;let e=dx-dy;
    while(x0!==x1||y0!==y1){const e2=2*e;if(e2>-dy){e-=dy;x0+=sx}if(e2<dx){e+=dx;y0+=sy}
      if((x0!==x1||y0!==y1)&&this.wall(x0,y0))return false}
    return true}
}

class Player{
  constructor(x,y){this.x=x;this.y=y;this.r=10;this.mhp=100;this.hp=100;this.atk=12;this.sp=165;this.as=1;
    this.xp=0;this.lvl=1;this.gold=0;this.pot=1;this.wt=0;this.at=0;
    this.rel={};this.cd=0;this.swing=0;this.sa=0;this.aim=0;this.dash=0;this.dcd=0;this.dv=[1,0];this.iv=0;this.mv=false;this.fl=0;this.stepT=0}
  dmg(){return Math.round(this.atk*(1+.25*this.wt)*rr(.9,1.1))}
  hurt(d,G){if(this.iv>0)return;d=Math.round(d*(1-.07*this.at));this.hp-=d;this.iv=.6;this.fl=.12;G.shake=8;G.snd.hurt();
    G.float(this.x,this.y-34,'-'+d,'#ff5050');G.burst(this.x,this.y-14,10,'#c01818',160,.5,300);
    if(this.hp<=0){if(this.rel.phoenix){delete this.rel.phoenix;this.hp=this.mhp*.5;this.iv=2;G.float(this.x,this.y-50,'PHOENIX REVIVE','#ffb040');G.burst(this.x,this.y-14,30,'#ffb040',300,.9,-100);G.snd.lvl()}else G.over()}}
  update(dt,G){
    const k=G.keys;let dx=(k.d||k.arrowright?1:0)-(k.a||k.arrowleft?1:0),dy=(k.s||k.arrowdown?1:0)-(k.w||k.arrowup?1:0);
    const m=Math.hypot(dx,dy);this.mv=m>0;if(m){dx/=m;dy/=m}
    this.cd-=dt;this.swing-=dt;this.dcd-=dt;this.iv-=dt;this.fl-=dt;
    const gp=G.ground(G.mouse.x,G.mouse.y);this.aim=Math.atan2(gp.y-this.y,gp.x-this.x);
    if(this.dash>0){this.dash-=dt;G.move(this,this.dv[0]*520*dt,this.dv[1]*520*dt);
      if(R()<.7)G.parts.push(new Particle(this.x,this.y-8,rr(0,TAU),20,'rgba(200,190,170,.6)',.3,0,6))}
    else{G.move(this,dx*this.sp*dt,dy*this.sp*dt);
      if(m&&(this.stepT-=dt)<=0){this.stepT=.28;G.snd.step()}}
    if((G.dashReq)&&this.dcd<=0){G.dashReq=0;this.dash=.16;this.dcd=this.rel.boots?.75:1.1;this.iv=Math.max(this.iv,.32);
      this.dv=m?[dx,dy]:[Math.cos(this.aim),Math.sin(this.aim)];G.snd.dash()}
    G.dashReq=0;
    if(G.click&&this.cd<=0&&this.dash<=0)G.slash();
  }
  draw(c,G){
    G.shadow(c,this.x,this.y,12);c.save();c.translate(this.x,this.y);
    if(this.iv>0&&(G.t*30|0)%2)c.globalAlpha=.45;
    const b=Math.sin(G.t*(this.mv?14:3))*(this.mv?2:1.2),lg=this.mv?Math.sin(G.t*14)*3:0,w=this.fl>0;
    c.fillStyle=w?'#fff':'#3a2f2a';c.fillRect(-7,-8,5,8+lg);c.fillRect(2,-8,5,8-lg);
    c.fillStyle=w?'#fff':AC[this.at];c.fillRect(-8,-22+b,16,15);
    c.fillStyle=w?'#fff':'#00000040';c.fillRect(-8,-10+b,16,3);
    c.fillStyle=w?'#fff':'#e8b98a';c.beginPath();c.arc(0,-29+b,7,0,TAU);c.fill();
    c.fillStyle=w?'#fff':'#6a4a2a';c.beginPath();c.arc(0,-31+b,7,Math.PI,TAU);c.fill();
    c.translate(0,-16+b);const pr=1-Math.max(0,this.swing)/.2;
    c.rotate(this.swing>0?this.sa-1.2+pr*2.4:this.aim-.4);
    c.fillStyle='#5a3a1a';c.fillRect(3,-3,6,6);c.fillStyle=WC[this.wt];c.fillRect(9,-2,22,4);c.fillRect(31,-1,4,2);
    c.restore();
  }
}

class Enemy{
  constructor(type,x,y,fl){const d=ED[type],bs=type==='boss',bi=bs?Math.min(2,((fl/10-1)/3)|0):0,bk=bs?3**(fl/10-1-3*bi):1,s=bs?bk*[1.9,7.6,19][bi]:1+.4*(fl-1);
    this.bi=bi;this.dm=bs?bk*[1.4,2.5,4][bi]:1+.15*(fl-1);this.ls=bs?s:1+.2*(fl-1);this.rad=[110,135,120][bi];this.type=type;this.x=x;this.y=y;this.r=d.r;this.sp=d.sp*(1+.02*fl);
    this.hp=this.mhp=Math.round(d.hp*(1+bi*.4)*s);this.s=s;this.vx=0;this.vy=0;this.cd=rr(.5,1.5);this.fl=0;this.aw=false;this.st=0;this.tm=0;this.ph=R()*9}
  hit(d,a,crit,G){
    if(G.p.rel.vamp)G.p.hp=Math.min(G.p.mhp,G.p.hp+d*.1);this.hp-=d;this.fl=.1;if(this.type!=='boss')this.aw=true;const kb=this.type==='boss'?40:this.type==='golem'?120:320;this.vx=Math.cos(a)*kb;this.vy=Math.sin(a)*kb;
    G.snd.hit();G.shake=Math.max(G.shake,crit?9:3);G.float(this.x,this.y-34,(crit?'CRIT ':'')+d,crit?'#ffd040':'#fff');
    G.burst(this.x,this.y-12,crit?14:7,this.type==='skel'?'#ddd':'#b01818',200,.45,300);G.burst(this.x,this.y-12,4,'#ffd060',260,.25,0);
    if(this.hp<=0){G.kills++;const n=Math.max(1,Math.round(ED[this.type].g*Math.min(this.ls,12)*.4));
      for(let i=0;i<Math.min(n,8);i++)G.orbs.push({x:this.x,y:this.y,vx:rr(-120,120),vy:rr(-120,120),k:'g',v:Math.ceil(n/Math.min(n,8))});
      for(let i=0;i<3;i++)G.orbs.push({x:this.x,y:this.y,vx:rr(-120,120),vy:rr(-120,120),k:'x',v:Math.max(1,Math.round(ED[this.type].xp*Math.min(this.ls,12)*.2))});
      G.burst(this.x,this.y-12,18,'#a01010',260,.7,300);if(crit||this.type==='golem'||this.type==='boss'){G.stop=.03;G.shake=12}}
  }
  update(dt,G){
    const p=G.p,dx=p.x-this.x,dy=p.y-this.y,d=Math.hypot(dx,dy)||1,ux=dx/d,uy=dy/d;
    this.fl-=dt;this.cd-=dt;G.move(this,this.vx*dt,this.vy*dt);const f=Math.max(0,1-9*dt);this.vx*=f;this.vy*=f;
    const seen=G.d.los(this.x/T|0,this.y/T|0,p.x/T|0,p.y/T|0);
    if(!this.aw){if(this.type!=='boss'&&d<290&&seen)this.aw=true;else return}
    let mx=0,my=0;
    if(this.type==='skel'){mx=ux;my=uy;if(d<26&&this.cd<=0){p.hurt(10*this.dm,G);this.cd=1}}
    else if(this.type==='cult'||this.type==='wraith'){
      if(d<170&&seen){mx=-ux;my=-uy}else if(d>250||!seen){mx=ux;my=uy}else{mx=-uy*Math.sin(G.t+this.ph);my=ux*Math.sin(G.t+this.ph)}
      if(this.cd<=0&&d<420&&seen){this.cd=this.type==='wraith'?2.6:1.9;G.snd.shoot();
        for(const o of this.type==='wraith'?[-.35,0,.35]:[0]){const a=Math.atan2(uy,ux)+o;G.shots.push({x:this.x,y:this.y,vx:Math.cos(a)*200,vy:Math.sin(a)*200,l:4,d:7*this.dm})}}}
    else if(this.type==='boss'){
      const en=this.hp<this.mhp/2?1.4:1;
      if(this.st===0){mx=ux*en;my=uy*en;this.bc=(this.bc||2)-dt;
        if(this.bi===2&&(this.bl=(this.bl||3)-dt)<=0){this.bl=3.4/en;G.burst(this.x,this.y-30,20,'#c070ff',260,.6,0);const a=rr(0,TAU),r=this.rm;
          this.x=Math.max((r.x+1.5)*T,Math.min((r.x+r.w-1.5)*T,p.x+Math.cos(a)*120));this.y=Math.max((r.y+1.5)*T,Math.min((r.y+r.h-1.5)*T,p.y+Math.sin(a)*120));G.burst(this.x,this.y-30,20,'#c070ff',260,.6,0);G.snd.tone(500,'sine',.3,.12,-300)}
