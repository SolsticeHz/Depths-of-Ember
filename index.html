<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Depths of Ember</title>
<style>
:root{--bg:#0b0907;--fg:#e8d9b5;--ac:#e0a040;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0907}}
:root[data-theme="dark"]{--bg:#0b0907}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);overflow:hidden;font-family:Georgia,"Times New Roman",serif;user-select:none}
body{position:relative}canvas{display:block}
#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;background:rgba(8,5,4,.72)}
#ov.h{display:none}
#bx{max-width:520px;padding:28px 34px;border:2px solid #6b4a22;background:rgba(22,14,10,.92);box-shadow:0 0 40px #000}
h1{margin:0 0 8px;font-size:44px;letter-spacing:2px;color:var(--ac);text-shadow:0 0 18px #c2601a}
h2{margin:0 0 10px;color:var(--ac)}p{line-height:1.5;margin:8px 0}
button{font:inherit;color:var(--fg);background:#3a2412;border:2px solid #8a5a28;padding:10px 22px;margin:6px;cursor:pointer;font-size:17px}
button:hover,button:focus-visible{background:#6b3f1a;outline:none}
.cd{display:inline-block;width:140px;vertical-align:top}
</style></head><body>
<canvas id="cv"></canvas><div id="ov"><div id="bx"></div></div>
<script>
"use strict";
/* ===== Helpers & constants ===== */
const R=Math.random,rr=(a,b)=>a+R()*(b-a),ri=(a,b)=>Math.floor(rr(a,b+1)),TAU=Math.PI*2;
const T=40,WH=40,MW=56,MH=44,CA=Math.cos(.88),SA=Math.sin(.88),CD=520,CF=650; // CA/SA: camera pitch (~50 deg), CD: camera distance, CF: focal length
const WC=['#cfd6dd','#6fe38a','#5cb8ff','#c77dff','#ffb347','#ff5a5a']; // weapon tier / trail colours
const AC=['#7a5b3a','#8a8f98','#4f8fd0','#8a4fd0','#d0a030','#d04a4a']; // armor tier colours
const ED={skel:{hp:22,sp:110,r:11,xp:6,g:3},cult:{hp:16,sp:70,r:11,xp:9,g:5},golem:{hp:95,sp:48,r:17,xp:25,g:14}};

/* ===== Procedural audio ===== */
class SoundEngine{
  constructor(){this.c=null}
  init(){ // must run after a user gesture
    if(!this.c){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;this.c=new C();
      const n=this.c.sampleRate*.5,b=this.c.createBuffer(1,n,this.c.sampleRate),d=b.getChannelData(0);
      for(let i=0;i<n;i++)d[i]=R()*2-1;this.nb=b}
    if(this.c.state==='suspended')this.c.resume()}
  tone(f,t,d,v=.12,s=0,dl=0){if(!this.c)return;const c=this.c,o=c.createOscillator(),g=c.createGain(),n=c.currentTime+dl;
    o.type=t;o.frequency.setValueAtTime(f,n);if(s)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+s),n+d);
    g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(c.destination);o.start(n);o.stop(n+d+.02)}
  noise(d,v,f){if(!this.c)return;const c=this.c,s=c.createBufferSource(),fl=c.createBiquadFilter(),g=c.createGain(),n=c.currentTime;
    s.buffer=this.nb;fl.type='bandpass';fl.frequency.value=f;g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);
    s.connect(fl);fl.connect(g);g.connect(c.destination);s.start(n);s.stop(n+d)}
  swing(){this.noise(.15,.25,1800)} dash(){this.noise(.25,.25,800)} step(){this.noise(.05,.06,220)}
  hit(){this.noise(.12,.35,500);this.tone(140,'square',.12,.12,-80)} hurt(){this.tone(220,'sawtooth',.25,.18,-160)}
  pick(){this.tone(880,'sine',.1);this.tone(1320,'sine',.18,.1,0,.08)} shoot(){this.tone(640,'sine',.2,.08,-340)}
  boom(){this.noise(.4,.45,150);this.tone(90,'sine',.3,.3,-50)}
  lvl(){[523,659,784,1047].forEach((f,i)=>this.tone(f,'square',.25,.1,0,i*.1))}
}

/* ===== Particles ===== */
class Particle{
  constructor(x,y,a,s,c,l,g=0,z=3){this.x=x;this.y=y;this.vx=Math.cos(a)*s;this.vy=Math.sin(a)*s;this.c=c;this.l=this.m=l;this.g=g;this.z=z}
  update(dt){this.l-=dt;this.x+=this.vx*dt;this.y+=this.vy*dt;this.vy+=this.g*dt;this.vx*=.985}
  draw(c,o){const a=Math.max(0,this.l/this.m);c.globalAlpha=a;c.fillStyle=this.c;const s=this.z*(.4+a)*o.s;c.fillRect(o.x-s/2,o.y-s/2,s,s)}
}

/* ===== Dungeon (room-and-corridor generation) ===== */
class Dungeon{
  constructor(){
    this.g=Array.from({length:MH},()=>Array(MW).fill(1));
    this.ex=Array.from({length:MH},()=>Array(MW).fill(0));
    this.vis=Array.from({length:MH},()=>new Uint8Array(MW));
    this.lt=Array.from({length:MH},()=>new Float32Array(MW)); // smoothed per-tile light level used for rendering
    this.rooms=[];
    /* Binary Space Partitioning: recursively split the map, carve one room per leaf,
       then join the two halves of every split with an L-shaped corridor. */
    const carve=r=>{for(let j=r.y;j<r.y+r.h;j++)for(let k=r.x;k<r.x+r.w;k++)this.g[j][k]=0};
    const link=(a,b)=>{
      for(let x=Math.min(a.cx,b.cx);x<=Math.max(a.cx,b.cx)+1;x++){this.g[a.cy][x]=0;this.g[a.cy+1][x]=0}
      for(let y=Math.min(a.cy,b.cy);y<=Math.max(a.cy,b.cy)+1;y++){this.g[y][b.cx]=0;this.g[y][b.cx+1]=0}};
    const split=(n,dp)=>{
      const cw=n.w>=26,ch=n.h>=22;
      if(dp>=3||(!cw&&!ch)){ // leaf: place a room inside it
        const w=ri(6,Math.min(11,n.w-3)),h=ri(5,Math.min(8,n.h-3)),x=n.x+ri(1,n.w-w-2),y=n.y+ri(1,n.h-h-2);
        const r={x,y,w,h,cx:x+(w>>1),cy:y+(h>>1),type:'combat'};this.rooms.push(r);carve(r);return r}
      const v=cw&&(!ch||n.w/n.h>1.2||(n.w/n.h>.8&&R()<.5));let a,b;
      if(v){const s=ri(13,n.w-13);a=split({x:n.x,y:n.y,w:s,h:n.h},dp+1);b=split({x:n.x+s,y:n.y,w:n.w-s,h:n.h},dp+1)}
      else{const s=ri(11,n.h-11);a=split({x:n.x,y:n.y,w:n.w,h:s},dp+1);b=split({x:n.x,y:n.y+s,w:n.w,h:n.h-s},dp+1)}
      link(a,b);return R()<.5?a:b};
    split({x:1,y:1,w:MW-2,h:MH-2},0);
    const rs=this.rooms;rs[0].type='start';
    let far=rs[1],fd=0;rs.forEach(r=>{const q=Math.hypot(r.cx-rs[0].cx,r.cy-rs[0].cy);if(q>fd){fd=q;far=r}});far.type='exit'; // exit = farthest room from start
    const mid=rs.filter(r=>r.type==='combat');mid[ri(0,mid.length-1)].type='treasure';
  }
  wall(tx,ty){return tx<0||ty<0||tx>=MW||ty>=MH||this.g[ty][tx]===1}
  /** Line-of-sight scan (radius 8 tiles): marks visible tiles and records them as explored */
  look(px,py){const tx=px/T|0,ty=py/T|0,rad=7;
    for(const r of this.vis)r.fill(0);
    for(let j=-rad;j<=rad;j++)for(let i=-rad;i<=rad;i++){const x=tx+i,y=ty+j;
      if(i*i+j*j>rad*rad||x<0||y<0||x>=MW||y>=MH)continue;
      if(this.los(tx,ty,x,y)){this.vis[y][x]=1;this.ex[y][x]=1}}
    // walls bordering a visible floor tile are seen too, so room outlines do not break up
    for(let j=-rad;j<=rad;j++)for(let i=-rad;i<=rad;i++){const x=tx+i,y=ty+j;
      if(x<1||y<1||x>=MW-1||y>=MH-1||this.vis[y][x]||!this.wall(x,y))continue;
      for(let b=-1;b<=1;b++)for(let a=-1;a<=1;a++)if(this.vis[y+b][x+a]&&!this.wall(x+a,y+b)){this.vis[y][x]=1;this.ex[y][x]=1}}}
  /** Bresenham walk between two tiles; any wall strictly between them blocks sight */
  los(x0,y0,x1,y1){const dx=Math.abs(x1-x0),dy=Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1;let e=dx-dy;
    while(x0!==x1||y0!==y1){const e2=2*e;if(e2>-dy){e-=dy;x0+=sx}if(e2<dx){e+=dx;y0+=sy}
      if((x0!==x1||y0!==y1)&&this.wall(x0,y0))return false}
    return true}
}

/* ===== Player ===== */
class Player{
  constructor(x,y){this.x=x;this.y=y;this.r=10;this.mhp=100;this.hp=100;this.atk=12;this.sp=165;this.as=1;
    this.xp=0;this.lvl=1;this.gold=0;this.pot=1;this.wt=0;this.at=0;
    this.cd=0;this.swing=0;this.sa=0;this.aim=0;this.dash=0;this.dcd=0;this.dv=[1,0];this.iv=0;this.mv=false;this.fl=0;this.stepT=0}
  dmg(){return Math.round(this.atk*(1+.25*this.wt)*rr(.9,1.1))}
  hurt(d,G){if(this.iv>0)return;d=Math.round(d*(1-.07*this.at));this.hp-=d;this.iv=.6;this.fl=.12;G.shake=8;G.snd.hurt();
    G.float(this.x,this.y-34,'-'+d,'#ff5050');G.burst(this.x,this.y-14,10,'#c01818',160,.5,300);if(this.hp<=0)G.over()}
  update(dt,G){
    const k=G.keys;let dx=(k.d||k.arrowright?1:0)-(k.a||k.arrowleft?1:0),dy=(k.s||k.arrowdown?1:0)-(k.w||k.arrowup?1:0);
    const m=Math.hypot(dx,dy);this.mv=m>0;if(m){dx/=m;dy/=m}
    this.cd-=dt;this.swing-=dt;this.dcd-=dt;this.iv-=dt;this.fl-=dt;
    const gp=G.ground(G.mouse.x,G.mouse.y);this.aim=Math.atan2(gp.y-this.y,gp.x-this.x);
    if(this.dash>0){this.dash-=dt;G.move(this,this.dv[0]*520*dt,this.dv[1]*520*dt);
      if(R()<.7)G.parts.push(new Particle(this.x,this.y-8,rr(0,TAU),20,'rgba(200,190,170,.6)',.3,0,6))}
    else{G.move(this,dx*this.sp*dt,dy*this.sp*dt);
      if(m&&(this.stepT-=dt)<=0){this.stepT=.28;G.snd.step()}}
    if((G.dashReq)&&this.dcd<=0){G.dashReq=0;this.dash=.16;this.dcd=1.1;this.iv=Math.max(this.iv,.32);
      this.dv=m?[dx,dy]:[Math.cos(this.aim),Math.sin(this.aim)];G.snd.dash()}
    G.dashReq=0;
    if(G.click&&this.cd<=0&&this.dash<=0)G.slash();
  }
  draw(c,G){
    G.shadow(c,this.x,this.y,12);c.save();c.translate(this.x,this.y);
    if(this.iv>0&&(G.t*30|0)%2)c.globalAlpha=.45;
    const b=Math.sin(G.t*(this.mv?14:3))*(this.mv?2:1.2),lg=this.mv?Math.sin(G.t*14)*3:0,w=this.fl>0;
    c.fillStyle=w?'#fff':'#3a2f2a';c.fillRect(-7,-8,5,8+lg);c.fillRect(2,-8,5,8-lg);
    c.fillStyle=w?'#fff':AC[this.at];c.fillRect(-8,-22+b,16,15);
    c.fillStyle=w?'#fff':'#00000040';c.fillRect(-8,-10+b,16,3);
    c.fillStyle=w?'#fff':'#e8b98a';c.beginPath();c.arc(0,-29+b,7,0,TAU);c.fill();
    c.fillStyle=w?'#fff':'#6a4a2a';c.beginPath();c.arc(0,-31+b,7,Math.PI,TAU);c.fill();
    c.translate(0,-16+b);const pr=1-Math.max(0,this.swing)/.2;
    c.rotate(this.swing>0?this.sa-1.2+pr*2.4:this.aim-.4);
    c.fillStyle='#5a3a1a';c.fillRect(3,-3,6,6);c.fillStyle=WC[this.wt];c.fillRect(9,-2,22,4);c.fillRect(31,-1,4,2);
    c.restore();
  }
}

/* ===== Enemies ===== */
class Enemy{
  constructor(type,x,y,fl){const d=ED[type],s=1+.18*(fl-1);this.type=type;this.x=x;this.y=y;this.r=d.r;this.sp=d.sp*(1+.02*fl);
    this.hp=this.mhp=Math.round(d.hp*s);this.s=s;this.vx=0;this.vy=0;this.cd=rr(.5,1.5);this.fl=0;this.aw=false;this.st=0;this.tm=0;this.ph=R()*9}
  hit(d,a,crit,G){
    this.hp-=d;this.fl=.1;this.aw=true;const kb=this.type==='golem'?120:320;this.vx=Math.cos(a)*kb;this.vy=Math.sin(a)*kb;
    G.snd.hit();G.shake=Math.max(G.shake,crit?9:3);G.float(this.x,this.y-34,(crit?'CRIT ':'')+d,crit?'#ffd040':'#fff');
    G.burst(this.x,this.y-12,crit?14:7,this.type==='skel'?'#ddd':'#b01818',200,.45,300);G.burst(this.x,this.y-12,4,'#ffd060',260,.25,0);
    if(this.hp<=0){G.kills++;const n=Math.ceil(ED[this.type].g*this.s);
      for(let i=0;i<Math.min(n,8);i++)G.orbs.push({x:this.x,y:this.y,vx:rr(-120,120),vy:rr(-120,120),k:'g',v:Math.ceil(n/Math.min(n,8))});
      for(let i=0;i<3;i++)G.orbs.push({x:this.x,y:this.y,vx:rr(-120,120),vy:rr(-120,120),k:'x',v:Math.ceil(ED[this.type].xp*this.s/3)});
      G.burst(this.x,this.y-12,18,'#a01010',260,.7,300);if(crit||this.type==='golem'){G.stop=.03;G.shake=12}}
  }
  update(dt,G){
    const p=G.p,dx=p.x-this.x,dy=p.y-this.y,d=Math.hypot(dx,dy)||1,ux=dx/d,uy=dy/d;
    this.fl-=dt;this.cd-=dt;G.move(this,this.vx*dt,this.vy*dt);const f=Math.max(0,1-9*dt);this.vx*=f;this.vy*=f;
    const seen=G.d.los(this.x/T|0,this.y/T|0,p.x/T|0,p.y/T|0); // enemies need line of sight to notice or shoot you
    if(!this.aw){if(d<290&&seen)this.aw=true;else return}
    let mx=0,my=0;
    if(this.type==='skel'){mx=ux;my=uy;if(d<26&&this.cd<=0){p.hurt(8+2*this.s,G);this.cd=1}}
    else if(this.type==='cult'){
      if(d<170&&seen){mx=-ux;my=-uy}else if(d>250||!seen){mx=ux;my=uy}else{mx=-uy*Math.sin(G.t+this.ph);my=ux*Math.sin(G.t+this.ph)}
      if(this.cd<=0&&d<420&&seen){this.cd=1.9;G.snd.shoot();G.shots.push({x:this.x,y:this.y,vx:ux*200,vy:uy*200,l:4,d:6+2*this.s})}}
    else{ // golem: chase, telegraph, slam
      if(this.st===0){mx=ux;my=uy;if(d<72&&this.cd<=0){this.st=1;this.tm=.9}}
      else if(this.st===1){this.tm-=dt;if(this.tm<=0){this.st=2;this.tm=.7;G.snd.boom();G.shake=14;G.burst(this.x,this.y,26,'#8a7a60',320,.6,200);
        if(Math.hypot(p.x-this.x,p.y-this.y)<84)p.hurt(16+3*this.s,G)}}
      else{this.tm-=dt;if(this.tm<=0){this.st=0;this.cd=1.2}}}
    G.move(this,mx*this.sp*dt,my*this.sp*dt);
  }
  draw(c,G){
    const w=this.fl>0,b=Math.sin(G.t*6+this.ph)*1.5;
    if(this.type==='golem'){G.shadow(c,this.x,this.y,22);
      if(this.st===1){const pr=1-this.tm/.9;c.fillStyle='rgba(255,60,30,'+(.12+.25*pr)+')';c.beginPath();c.ellipse(this.x,this.y,84,63,0,0,TAU);c.fill();
        c.strokeStyle='rgba(255,90,40,.8)';c.beginPath();c.ellipse(this.x,this.y,84*pr,63*pr,0,0,TAU);c.stroke()}}
    else G.shadow(c,this.x,this.y,12);
    c.save();c.translate(this.x,this.y);
    if(this.type==='skel'){const l=Math.sin(G.t*12+this.ph)*3;
      c.fillStyle=w?'#fff':'#d8d2c0';c.fillRect(-6,-9,4,9+l);c.fillRect(2,-9,4,9-l);c.fillRect(-7,-22+b,14,13);
      c.fillStyle='#3a342a';for(let i=0;i<3;i++)c.fillRect(-5,-20+b+i*4,10,1.5);
      c.fillStyle=w?'#fff':'#e8e2d0';c.beginPath();c.arc(0,-28+b,7,0,TAU);c.fill();
      c.fillStyle='#200';c.fillRect(-4,-30+b,3,3);c.fillRect(1,-30+b,3,3);
      c.fillStyle='#aaa';c.fillRect(8,-20+b,3,16)}
    else if(this.type==='cult'){
      c.fillStyle=w?'#fff':'#4a1f6a';c.beginPath();c.moveTo(-10,0);c.lineTo(10,0);c.lineTo(5,-26+b);c.lineTo(-5,-26+b);c.fill();
      c.fillStyle=w?'#fff':'#331250';c.beginPath();c.arc(0,-28+b,8,0,TAU);c.fill();
      c.fillStyle='#e070ff';c.shadowColor='#e070ff';c.shadowBlur=8;c.fillRect(-4,-29+b,3,2);c.fillRect(1,-29+b,3,2);c.shadowBlur=0}
    else{const sl=this.st===2?8:0;
      c.fillStyle=w?'#fff':'#6a6258';c.fillRect(-14,-14,28,14);c.fillRect(-18,-34+b+sl,36,22);c.fillRect(-26,-32+b+sl,10,22);c.fillRect(16,-32+b+sl,10,22);
      c.fillStyle=w?'#fff':'#524a42';c.fillRect(-8,-44+b+sl,16,12);
      c.fillStyle='#ff8a30';c.shadowColor='#ff6a10';c.shadowBlur=12;c.fillRect(-5,-28+b+sl,10,8);c.fillRect(-4,-41+b+sl,8,3);c.shadowBlur=0}
    c.restore();
    if(this.hp<this.mhp){const w2=this.type==='golem'?44:26,h=this.type==='golem'?-54:-42;c.fillStyle='#000a';c.fillRect(this.x-w2/2,this.y+h,w2,4);c.fillStyle='#d03030';c.fillRect(this.x-w2/2,this.y+h,w2*this.hp/this.mhp,4)}
  }
}

/* ===== Game ===== */
class Game{
  constructor(){
    this.cv=document.getElementById('cv');this.c=this.cv.getContext('2d');this.fog=document.createElement('canvas');this.fc=this.fog.getContext('2d');
    this.snd=new SoundEngine();this.keys={};this.mouse={x:0,y:0};this.click=false;this.dashReq=0;this.state='title';this.t=0;this.last=0;this.cam={x:0,y:0};
    this.floor=1;this.kills=0;this.goldTotal=0;this.parts=[];this.floats=[];this.shake=0;this.stop=0;
    this.resize();addEventListener('resize',()=>this.resize());
    addEventListener('keydown',e=>{const k=e.key.toLowerCase();this.keys[k]=1;if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k))e.preventDefault();
      if(this.state==='levelup'&&'123'.includes(k)&&k)return this.pick(+k-1);
      if(k===' '&&this.state==='play')this.dashReq=1;if((k==='q'||k==='1')&&this.state==='play')this.usePotion();
      if((k==='p'||k==='escape')&&(this.state==='play'||this.state==='pause'))this.togglePause()});
    addEventListener('keyup',e=>this.keys[e.key.toLowerCase()]=0);
    this.cv.addEventListener('mousemove',e=>{const r=this.cv.getBoundingClientRect();this.mouse.x=e.clientX-r.left;this.mouse.y=e.clientY-r.top});
    this.cv.addEventListener('mousedown',e=>{this.snd.init();if(e.button===0)this.click=true;else if(e.button===2&&this.state==='play')this.dashReq=1});
    addEventListener('mouseup',e=>{if(e.button===0)this.click=false});
    this.cv.addEventListener('contextmenu',e=>e.preventDefault());
    this.newRun(true);this.showTitle();
    requestAnimationFrame(t=>this.frame(t));
  }
  resize(){this.W=this.cv.width=this.fog.width=document.body.clientWidth;this.H=this.cv.height=this.fog.height=document.body.clientHeight}
  /* --- overlays --- */
  ui(h){const o=document.getElementById('ov');document.getElementById('bx').innerHTML=h||'';o.className=h?'':'h'}
  showTitle(){this.state='title';this.ui('<h1>Depths of Ember</h1><p>Descend through the torchlit crypt. Slay, loot and grow stronger.</p><p>WASD / Arrows: move &nbsp; Left-click: slash<br>Space / Right-click: dash &nbsp; Q or 1: potion &nbsp; P: pause</p><button id="go">Enter the Dungeon</button>');
    document.getElementById('go').onclick=()=>{this.snd.init();this.newRun(false);this.state='play';this.ui('')}}
  togglePause(){if(this.state==='play'){this.state='pause';this.ui('<h2>Paused</h2><p>Floor '+this.floor+' · Level '+this.p.lvl+'</p><button id="rs">Resume</button>');document.getElementById('rs').onclick=()=>this.togglePause()}
    else{this.state='play';this.ui('')}}

      if(al<.03)return;c.globalAlpha=Math.min(1,al);if(o.z<0){c.save();c.beginPath();c.rect(0,0,W,this.proj(0,this.stairs.y+32,0).y);c.clip();this.bb(o,o.f,o.sq);c.restore()} // hero sinks below the shaft rim
      else this.bb(o,o.f,o.sq);c.globalAlpha=1});
    // orbs, slash crescent, projectiles (additive glow)
    c.globalCompositeOperation='lighter';
    this.orbs.forEach(o=>{const q=this.proj(o.x,o.y,8);c.fillStyle=o.k==='g'?'#ffcc30':'#40d0ff';c.beginPath();c.arc(q.x,q.y,4*q.s,0,TAU);c.fill();c.globalAlpha=.3;c.beginPath();c.arc(q.x,q.y,9*q.s,0,TAU);c.fill();c.globalAlpha=1});
    this.shots.forEach(s=>{if(d.lt[Math.min(MH-1,s.y/T|0)][Math.min(MW-1,s.x/T|0)]<.5)return;const q=this.proj(s.x,s.y,18);c.fillStyle='#d060ff';c.beginPath();c.arc(q.x,q.y,6*q.s,0,TAU);c.fill();c.fillStyle='rgba(220,120,255,.35)';c.beginPath();c.arc(q.x,q.y,13*q.s,0,TAU);c.fill()});
    if(p.swing>0){const pr=1-p.swing/.2,a0=p.sa-1.2,a1=a0+2.4*Math.min(1,pr*1.5+.2),r=64+p.wt*3;
      const q=this.proj(p.x,p.y,16);c.save();c.translate(q.x,q.y);c.scale(q.s,q.s*.75);
      c.globalAlpha=Math.max(0,p.swing/.2);c.fillStyle=WC[p.wt];c.beginPath();c.arc(0,0,r,a0,a1);c.arc(0,0,r-16,a1,a0,true);c.fill();c.restore()}
    c.globalAlpha=1;this.parts.forEach(q=>q.draw(c,this.proj(q.x,q.y,3)));c.globalAlpha=1;
    c.globalCompositeOperation='source-over';
    this.floats.forEach(f=>{const q=this.proj(f.x,f.y,20);c.globalAlpha=Math.min(1,f.l*2);c.font='bold '+Math.round(15*q.s)+'px Georgia';c.textAlign='center';c.lineWidth=3;c.strokeStyle='#000';c.strokeText(f.t,q.x,q.y);c.fillStyle=f.c;c.fillText(f.t,q.x,q.y)});
    c.globalAlpha=1;
    // warm torch tint
    const pq=this.proj(p.x,p.y,20),px=pq.x,py=pq.y,fl=1+Math.sin(this.t*17)*.04+Math.sin(this.t*7.3)*.05+rr(-.02,.02);
    let g=c.createRadialGradient(px,py,10,px,py,300*fl*pq.s);g.addColorStop(0,'rgba(255,150,50,.22)');g.addColorStop(1,'rgba(255,100,20,0)');
    c.globalCompositeOperation='lighter';c.fillStyle=g;c.fillRect(0,0,W,H);c.globalCompositeOperation='source-over';
    // torch falloff: the scene darkens smoothly with distance from the flame (no hard cut-off)
    g=c.createRadialGradient(px,py,30,px,py,310*fl*pq.s);g.addColorStop(0,'rgba(3,2,5,0)');g.addColorStop(.5,'rgba(3,2,5,.3)');g.addColorStop(1,'rgba(3,2,5,.9)');
    c.fillStyle=g;c.fillRect(0,0,W,H);
    // HD-2D style tilt-shift: a blurred, downscaled copy of the scene fades in at the top and bottom edges
    if(!this.bc)this.bc=document.createElement('canvas');
    const bw=W>>2,bh=H>>2;if(this.bc.width!==bw)this.bc.width=bw;if(this.bc.height!==bh)this.bc.height=bh;
    const bt=this.bc.getContext('2d');bt.globalCompositeOperation='copy';bt.imageSmoothingQuality='high';bt.drawImage(this.cv,0,0,bw,bh);
    bt.globalCompositeOperation='destination-in';const bg=bt.createLinearGradient(0,0,0,bh);
    bg.addColorStop(0,'#000');bg.addColorStop(.2,'rgba(0,0,0,0)');bg.addColorStop(.74,'rgba(0,0,0,0)');bg.addColorStop(1,'#000');bt.fillStyle=bg;bt.fillRect(0,0,bw,bh);
    c.imageSmoothingEnabled=true;c.drawImage(this.bc,0,0,W,H);
    const vg=c.createRadialGradient(W/2,H/2,H*.35,W/2,H/2,H*.95);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.55)');c.fillStyle=vg;c.fillRect(0,0,W,H);
    if(this.state!=='title')this.hud(c);
    if(this.fade>0){c.fillStyle='rgba(0,0,0,'+this.fade+')';c.fillRect(0,0,W,H)}
  }
  hud(c){
    const p=this.p,W=this.W,H=this.H;c.textAlign='left';c.font='bold 14px Georgia';
    const bar=(x,y,w,h,v,col,t)=>{c.fillStyle='#000c';c.fillRect(x-2,y-2,w+4,h+4);c.fillStyle=col;c.fillRect(x,y,w*Math.max(0,Math.min(1,v)),h);c.strokeStyle='#8a5a28';c.strokeRect(x-2,y-2,w+4,h+4);
      c.fillStyle='#fff';c.fillText(t,x+6,y+h-4)};
    bar(16,16,220,20,p.hp/p.mhp,'#b02828','HP '+Math.ceil(p.hp)+' / '+p.mhp);bar(16,44,220,10,p.xp/p.xpn,'#3aa0d0','');
    c.fillStyle='#e8d9b5';c.fillText('Lv '+p.lvl+'   Floor '+this.floor+'   Gold '+p.gold,16,76);
    c.fillText('Potions '+p.pot+' [Q]   Weapon T'+p.wt+'   Armor T'+p.at,16,96);
    // dash cooldown ring
    const rx=W/2,ry=H-34,rd=Math.max(0,p.dcd)/1.1;c.strokeStyle='#000a';c.lineWidth=7;c.beginPath();c.arc(rx,ry,16,0,TAU);c.stroke();
    c.strokeStyle=rd>0?'#a07030':'#60e0a0';c.beginPath();c.arc(rx,ry,16,-Math.PI/2,-Math.PI/2+TAU*(1-rd));c.stroke();c.lineWidth=1;
    c.textAlign='center';c.fillStyle='#e8d9b5';c.fillText('Dash',rx,ry+34);
    // minimap
    const s=3,mw=MW*s,mh=MH*s,mx=W-mw-14,my=14;c.fillStyle='rgba(0,0,0,.45)';c.fillRect(mx-3,my-3,mw+6,mh+6);c.strokeStyle='#8a5a28';c.strokeRect(mx-3,my-3,mw+6,mh+6);
    for(let y=0;y<MH;y++)for(let x=0;x<MW;x++)if(this.d.ex[y][x]&&!this.d.g[y][x]){c.fillStyle='rgba(200,170,120,.65)';c.fillRect(mx+x*s,my+y*s,s,s)}
    const sx=this.stairs.x/T|0,sy=this.stairs.y/T|0;if(this.d.ex[sy][sx]){c.fillStyle='#ffb040';c.fillRect(mx+sx*s-1,my+sy*s-1,5,5)}
    c.fillStyle='#50ff80';c.fillRect(mx+(p.x/T|0)*s-1,my+(p.y/T|0)*s-1,5,5);
  }
  frame(t){
    const dt=Math.min(.05,(t-this.last)/1000||0);this.last=t;
    if(this.state==='play'){if(this.stop>0)this.stop-=dt;else this.update(dt)}
    else if(this.state==='title')this.t+=dt;
    else if(this.state==='descend')this.descend(dt);
    this.rdt=dt;this.render();requestAnimationFrame(t=>this.frame(t));
  }
}
new Game();
</script></body></html>
